# Local development services only (doc 12). The API, web and worker run on the host via `pnpm dev`.
# Host ports are offset from the defaults so this stack can sit next to other local Postgres/Redis/MinIO.
# Override with ZOAURO_*_PORT in your shell if needed. Dev credentials only.
name: zoauro

services:
  postgres:
    image: postgres:16
    container_name: zoauro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - '${ZOAURO_PG_PORT:-5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the unix socket: socket connections from the health check crashed backends (exit code 2) on this host.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U zoauro_app -d zoauro']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  redis:
    image: redis:7
    container_name: zoauro-redis
    ports:
      - '${ZOAURO_REDIS_PORT:-6390}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO removed minio/minio and minio/mc from Docker Hub (Sep 2026). Chainguard build, local dev only.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: zoauro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_secret
    ports:
         - '${ZOAURO_MINIO_PORT:-9010}:9000'
         - '${ZOAURO_MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - miniodata:/data

  # Creates the bucket once MinIO is up, then exits. Replaces the old minio/mc init container.
  minio-init:
    image: amazon/aws-cli:latest
    container_name: zoauro-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minio_dev
      AWS_SECRET_ACCESS_KEY: minio_dev_secret
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: ['sh', '-c']
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://minio:9000 s3 mb s3://${S3_BUCKET:-zoauro} || true

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: zoauro-mailpit
    ports:
      - '${ZOAURO_SMTP_PORT:-1025}:1025'
      - '${ZOAURO_MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata: