# Local development services only (doc 12). The API, web and worker run on the host via `pnpm dev`.
# Host ports are offset from the defaults so this stack can sit next to other local Postgres/Redis/MinIO.
# Override with ZOAURO_*_PORT in your shell if needed. Dev credentials only.
name: zoauro

services:
  postgres:
    image: postgres:16
    container_name: zoauro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - '${ZOAURO_PG_PORT:-5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the unix socket: socket connections from the health check crashed backends (exit code 2) on this host.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U zoauro_app -d zoauro']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  redis:
    image: redis:7
    container_name: zoauro-redis
    ports:
      - '${ZOAURO_REDIS_PORT:-6390}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: zoauro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zoauro_minio
      MINIO_ROOT_PASSWORD: zoauro_minio_dev
    ports:
      - '${ZOAURO_MINIO_PORT:-9020}:9000'
      - '${ZOAURO_MINIO_CONSOLE_PORT:-9021}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: zoauro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 zoauro_minio zoauro_minio_dev &&
        mc mb --ignore-existing local/zoauro-dev

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: zoauro-mailpit
    ports:
      - '${ZOAURO_SMTP_PORT:-1025}:1025'
      - '${ZOAURO_MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
