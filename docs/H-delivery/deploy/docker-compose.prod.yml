# Starting point. Review before use. Images come from ECR; secrets are injected into /opt/zoauro/.env.secrets by a start-up script reading Secrets Manager.
services:
  api:
    image: ${ECR}/zoauro-api:${TAG}
    env_file: [.env, .env.secrets]
    restart: unless-stopped
    depends_on: [redis]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"], interval: 15s, timeout: 3s, retries: 5 }
    expose: ["4000"]
  worker:
    image: ${ECR}/zoauro-api:${TAG}
    command: ["node", "dist/worker.js"]   # BullMQ: outbox publisher, webhooks, payouts, reconciliation, exports
    env_file: [.env, .env.secrets]
    restart: unless-stopped
    depends_on: [redis]
  web:
    image: ${ECR}/zoauro-web:${TAG}
    env_file: [.env]
    restart: unless-stopped
    expose: ["3000"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/zoauro.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  redis-data:
