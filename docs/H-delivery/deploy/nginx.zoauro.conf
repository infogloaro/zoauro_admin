# Starting point. Replace admin.example.com. Rate-limit zones are defined in the http block (see bottom note).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $http_x_zoauro_key_id zone=intake:10m rate=15r/s;

server {
  listen 80;
  server_name admin.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name admin.example.com;
  ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api:4000; include /etc/nginx/proxy_params; }
  location /api/v1/intake/    { limit_req zone=intake burst=60 nodelay; proxy_pass http://api:4000; include /etc/nginx/proxy_params; }
  location /api/v1/webhooks/  { proxy_pass http://api:4000; include /etc/nginx/proxy_params; }
  location /api/              { proxy_pass http://api:4000; include /etc/nginx/proxy_params; }
  location /socket.io/        { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; include /etc/nginx/proxy_params; }
  location /                  { proxy_pass http://web:3000; include /etc/nginx/proxy_params; }
}
# proxy_params must set Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto. The API must verify HMAC on the raw body: do not let Nginx or any middleware re-serialise JSON.
