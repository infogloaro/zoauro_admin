openapi: 3.0.3
info:
  title: ZOAURO Integration API (inbound from customer, vendor and partner apps)
  version: 1.0.0
  description: Server-to-server. Authenticate with HMAC (see docs/G-integration/42). All mutating calls require Idempotency-Key.
servers:
- url: https://admin.example.com/api/v1/intake
  description: production (replace)
- url: https://staging-admin.example.com/api/v1/intake
  description: sandbox (replace)
security:
- HmacAuth: []
paths:
  /ping:
    get:
      summary: Connectivity and clock check
      tags:
      - Common
      x-required-scope: (any)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ping'
        4XX: &id001
          $ref: '#/components/responses/Error'
        5XX: &id002
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Zoauro-Key-Id
        in: header
        required: true
        schema:
          type: string
      - name: X-Zoauro-Timestamp
        in: header
        required: true
        schema:
          type: string
  /config:
    get:
      summary: Rules the app must honour
      tags:
      - Common
