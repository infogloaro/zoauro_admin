name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal pipeline: lint, typecheck, API contract check, tests (including the authorization matrix).
# F0.5 adds pnpm audit, gitleaks and the rest. Same services and roles script as the local Docker stack.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # roles and the zoauro database come from infra/initdb/01-roles.sql (dev passwords, CI only)
      DATABASE_URL_MIGRATE: postgresql://zoauro_owner:zoauro_owner_dev@localhost:5432/zoauro
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create database roles and the zoauro database
        env:
          PGPASSWORD: postgres_ci
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/initdb/01-roles.sql

      - run: pnpm lint
      - run: pnpm typecheck

      # fails when apps/api/openapi/openapi.json or packages/api-client/src/schema.ts differ from the code
      - run: pnpm openapi:check

      # includes tests/authz: the authorization matrix over every route in the OpenAPI document
      - run: pnpm test

      - name: Keep the list of routes the matrix covered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-matrix
          path: apps/api/test-reports/
          if-no-files-found: warn
